name: 로또 회차 데이터 자동 갱신

on:
  schedule:
    - cron: '0 16 * * 6'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-lotto-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch new draws and update data files
        run: npx tsx scripts/update-latest-draws.ts

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/lotto-full-history.json data/lotto-history-seed.json data/latest-draw-fallback.json; then
            echo "No new draw data — nothing to commit."
          else
            git add data/lotto-full-history.json data/lotto-history-seed.json data/latest-draw-fallback.json
            git commit -m "chore: auto-update lotto draw data ($(date -u +%Y-%m-%d))"
            git push origin master
          fi
